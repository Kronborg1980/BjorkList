<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* ---------- tokens ---------- */
:root{
  --bark:#2A2E27;
  --bark-soft:#5C6357;
  --paper:#EFF2EC;
  --card:#FFFFFF;
  --line:#DCE2D6;
  --leaf:#4F8B4A;
  --leaf-deep:#3B6B38;
  --leaf-soft:#CFE4C4;
  --sky:#CFE0EA;
  --berry:#C2453C;
  --sun:#E7B14A;
  --lilac:#D5CDE8;
  --shadow:0 1px 0 rgba(42,46,39,.06), 0 10px 30px -18px rgba(42,46,39,.45);
  --r-lg:22px; --r-md:16px; --r-sm:11px;
  --row:60px;
  --f-ui:'Nunito', ui-rounded, "Segoe UI", system-ui, sans-serif;
  --f-dis:'Fraunces', Georgia, serif;
}
:root[data-theme="dusk"]{
  --bark:#EDF1E8;
  --bark-soft:#A6B09E;
  --paper:#1A1E19;
  --card:#242A22;
  --line:#38402F;
  --leaf:#7CBF74;
  --leaf-deep:#A5D89C;
  --leaf-soft:#33452F;
  --sky:#2C3B45;
  --lilac:#3B3549;
  --shadow:0 10px 30px -18px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--bark);
  font-family:var(--f-ui); font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  padding-bottom:env(safe-area-inset-bottom);
}
/* birch bark texture: soft dashes down the left edge of the page */
body::before{
  content:""; position:fixed; inset:0 auto 0 0; width:26px; pointer-events:none; opacity:.5;
  background:
    repeating-linear-gradient(to bottom, transparent 0 46px, var(--line) 46px 50px, transparent 50px 96px),
    repeating-linear-gradient(to bottom, transparent 0 120px, var(--line) 120px 123px, transparent 123px 260px);
  -webkit-mask-image:linear-gradient(to bottom, transparent, #000 12%, #000 88%, transparent);
          mask-image:linear-gradient(to bottom, transparent, #000 12%, #000 88%, transparent);
}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer; border:0; background:none}
:focus-visible{outline:3px solid var(--leaf); outline-offset:2px; border-radius:8px}

/* ---------- shell ---------- */
.wrap{max-width:1080px; margin:0 auto; padding:0 16px 140px}
header.top{display:flex; align-items:center; gap:12px; padding:20px 0 10px}
.brand{display:flex; align-items:baseline; gap:9px; margin-right:auto; min-width:0}
.brand h1{
  font-family:var(--f-dis); font-weight:700; font-size:clamp(26px,6vw,38px);
  margin:0; letter-spacing:-.02em; white-space:nowrap;
}
.brand .bark{
  display:inline-block; width:10px; height:26px; border-radius:5px;
  background:var(--bark); opacity:.85; transform:rotate(-8deg);
}
.iconbtn{
  width:44px; height:44px; border-radius:14px; display:grid; place-items:center;
  background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); font-size:19px;
}
.iconbtn:active{transform:translateY(1px)}
#btnSync{position:relative}
#btnSync::after{content:""; position:absolute; right:6px; bottom:6px; width:9px; height:9px;
  border-radius:50%; background:var(--bark-soft); border:2px solid var(--card)}
#btnSync[data-state="on"]::after{background:var(--leaf)}
#btnSync[data-state="busy"]::after{background:var(--sun)}
#btnSync[data-state="err"]::after{background:var(--berry)}
.code{font-family:var(--f-dis); font-size:30px; font-weight:700; letter-spacing:.16em;  text-align:center; padding:14px; background:var(--paper); border:2px dashed var(--line);
  border-radius:var(--r-md); margin-bottom:12px; user-select:all; word-break:break-all}
.note{color:var(--bark-soft); font-weight:600; font-size:14px; margin:0 0 14px}
.gbtn{display:flex; align-items:center; justify-content:center; gap:11px; width:100%;
  min-height:56px; padding:0 18px; border-radius:16px; font-weight:800; font-size:17px;
  background:#fff; color:#1F1F1F; border:1px solid #DADCE0; box-shadow:var(--shadow); margin-bottom:12px}
.gbtn svg{width:22px; height:22px; flex:none}
.gbtn:active{transform:translateY(1px)}
.linkbtn{display:block; width:100%; text-align:center; padding:10px; font-weight:700;
  font-size:14.5px; color:var(--bark-soft); text-decoration:underline; text-underline-offset:3px}
.err{color:var(--berry); font-weight:700; font-size:14px; margin:0 0 12px; min-height:1px}
.field input[type=password], .field input[type=email]{width:100%; padding:12px 13px; border-radius:13px;
  border:2px solid var(--line); background:var(--paper); outline:none; font-weight:700}
.field input[type=password]:focus, .field input[type=email]:focus{border-color:var(--leaf)}

/* view switch */
.views{display:flex; gap:6px; background:var(--card); border:1px solid var(--line);
  border-radius:999px; padding:5px; box-shadow:var(--shadow); margin:6px 0 18px; width:fit-content}
.views button{padding:9px 18px; border-radius:999px; font-weight:700; font-size:15px; color:var(--bark-soft)}
.views button[aria-selected="true"]{background:var(--leaf); color:#fff}

/* list rail */
.rail{display:flex; gap:9px; overflow-x:auto; padding:2px 2px 14px; scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.chip{
  display:flex; align-items:center; gap:8px; padding:10px 16px; border-radius:999px;
  background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow);
  font-weight:700; white-space:nowrap; font-size:15px;
}
.chip[aria-current="true"]{border-color:transparent; box-shadow:inset 0 0 0 2.5px var(--leaf), var(--shadow)}
.chip .dot{width:9px; height:9px; border-radius:50%}
.chip .n{font-weight:800; font-size:12.5px; color:var(--bark-soft); background:var(--paper);
  border-radius:999px; padding:1px 7px}
.chip.add{border-style:dashed; color:var(--bark-soft)}

/* ---------- cards / progress ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r-lg);
  box-shadow:var(--shadow); padding:18px; margin-bottom:16px}
.hello{font-family:var(--f-dis); font-size:clamp(22px,5.4vw,30px); font-weight:700;
  margin:0 0 4px; letter-spacing:-.015em}
.sub{color:var(--bark-soft); font-weight:600; margin:0 0 14px; font-size:15px}
.bar{height:16px; border-radius:999px; background:var(--paper); border:1px solid var(--line);
  overflow:hidden; position:relative}
.bar i{display:block; height:100%; background:var(--leaf); border-radius:999px;
  transition:width .45s cubic-bezier(.22,1,.36,1)}
.bar::after{content:""; position:absolute; inset:0; pointer-events:none; opacity:.35;
  background:repeating-linear-gradient(90deg, transparent 0 22px, var(--bark) 22px 24px, transparent 24px 60px)}
@media (prefers-reduced-motion:reduce){ .bar i{transition:none} }

.grouphead{display:flex; align-items:center; gap:9px; margin:22px 4px 9px; font-weight:800; font-size:14.5px;
  color:var(--bark-soft)}
.grouphead .dot{width:10px; height:10px; border-radius:50%}

/* ---------- rows ---------- */
.rows{display:flex; flex-direction:column; gap:8px}
.row{
  display:flex; align-items:center; gap:12px; min-height:var(--row);
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-md);
  padding:8px 10px 8px 8px; box-shadow:var(--shadow); position:relative; touch-action:pan-y;
}
.row.dragging{z-index:5; box-shadow:0 18px 40px -16px rgba(42,46,39,.55); opacity:.97}
.row.done{background:color-mix(in srgb, var(--leaf-soft) 42%, var(--card))}
.row.done .txt{text-decoration:line-through; color:var(--bark-soft)}
.tick{
  flex:none; width:44px; height:44px; border-radius:13px; border:2.5px solid var(--line);
  background:var(--paper); display:grid; place-items:center; transition:transform .12s, background .15s, border-color .15s;
}
.tick svg{width:24px; height:24px; stroke:#fff; stroke-width:4; fill:none; stroke-linecap:round;
  stroke-linejoin:round; stroke-dasharray:30; stroke-dashoffset:30; transition:stroke-dashoffset .22s ease}
.row.done .tick{background:var(--leaf); border-color:var(--leaf)}
.row.done .tick svg{stroke-dashoffset:0}
.tick:active{transform:scale(.9)}
.pop{animation:pop .34s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){ .pop{animation:none} }
.emoji{flex:none; width:38px; height:38px; border-radius:11px; display:grid; place-items:center;
  font-size:22px; background:var(--paper); border:1px solid var(--line)}
.main{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.txt{font-weight:700; font-size:16.5px; outline:none; word-break:break-word; padding:2px 3px;
  border-radius:7px; min-height:24px}
.txt:focus{background:var(--paper); box-shadow:inset 0 0 0 2px var(--leaf)}
.tags{display:flex; gap:6px; flex-wrap:wrap}
.tag{font-size:12px; font-weight:800; color:var(--bark-soft); background:var(--paper);
  border:1px solid var(--line); border-radius:999px; padding:2px 9px}
.tag.on{color:var(--leaf-deep); border-color:var(--leaf); background:var(--leaf-soft)}
.rowtools{display:flex; align-items:center; gap:2px}
.rowbtn{flex:none; width:36px; height:36px; border-radius:10px; display:grid; place-items:center;
  color:var(--bark-soft); font-size:17px}
.more{display:none; font-size:22px; letter-spacing:1px}
/* on a phone the four buttons ate the width the words needed, so they collapse into one */
@media (max-width:680px){
  .rowtools{display:none}
  .more{display:grid}
  .row{gap:9px; padding:7px 6px 7px 7px}
  .emoji{width:34px; height:34px; font-size:19px; border-radius:10px}
  .txt{font-size:16px}
  .tag{font-size:11px; padding:1px 8px}
  .tags .tag:nth-child(n+2){display:none}
  :root{--row:54px}
  .card{padding:15px; margin-bottom:13px}
  .rows{gap:7px}
  .grouphead{margin:16px 4px 8px}
  .views{margin:4px 0 14px}
  .rail{padding-bottom:11px}
  .chip{padding:9px 14px}
  header.top{padding:16px 0 6px}
}
body.big .more{display:none}
.rowbtn:hover{background:var(--paper)}
.handle{cursor:grab; touch-action:none; font-size:15px; letter-spacing:1px}
.row.dragging .handle{cursor:grabbing}

/* add box */
.addbox{display:flex; align-items:center; gap:10px; margin-top:12px; background:var(--card);
  border:2px dashed var(--line); border-radius:var(--r-md); padding:8px 10px; min-height:var(--row)}
.addbox input{flex:1; min-width:0; border:0; background:none; outline:none; font-weight:700; font-size:16.5px; padding:6px 2px}
.addbox input::placeholder{color:var(--bark-soft); font-weight:600}
.micbtn{flex:none; height:44px; width:44px; border-radius:13px; background:var(--paper);
  border:1px solid var(--line); display:grid; place-items:center; font-size:19px}
body.listening .addbox{border-color:var(--berry); border-style:solid}
body.listening .micbtn{background:var(--berry); border-color:var(--berry); animation:beat 1.1s infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
@media (prefers-reduced-motion:reduce){ body.listening .micbtn{animation:none} }
.hearing{display:flex; align-items:center; gap:8px; color:var(--berry); font-weight:700;
  font-size:13.5px; margin:8px 4px 0}
.addbtn{flex:none; height:44px; min-width:44px; padding:0 16px; border-radius:13px; background:var(--leaf);
  color:#fff; font-weight:800; font-size:17px; display:grid; place-items:center; box-shadow:var(--shadow)}
.addbtn:active{transform:translateY(1px)}

/* week grid */
.weekwrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
table.week{border-collapse:separate; border-spacing:0 8px; width:100%; min-width:560px}
table.week th{font-size:13px; font-weight:800; color:var(--bark-soft); padding:0 0 4px; text-align:center; width:52px}
table.week th.namecol{text-align:left; width:auto; padding-left:8px}
table.week th.today{color:var(--leaf-deep)}
table.week td{background:var(--card); border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:8px 4px}
table.week td.namecell{border-left:1px solid var(--line); border-radius:var(--r-md) 0 0 var(--r-md); padding-left:12px;
  font-weight:700; display:table-cell}
table.week td:last-child{border-right:1px solid var(--line); border-radius:0 var(--r-md) var(--r-md) 0}
table.week td.cellwrap{text-align:center}
.cell{width:36px; height:36px; border-radius:10px; border:2.5px solid var(--line); background:var(--paper);
  display:inline-grid; place-items:center; color:#fff}
.cell[data-on="1"]{background:var(--leaf); border-color:var(--leaf)}
.cell[data-off="1"]{opacity:.25; pointer-events:none; border-style:dotted}
.cell svg{width:19px; height:19px; stroke:#fff; stroke-width:4.5; fill:none; stroke-linecap:round; stroke-linejoin:round; visibility:hidden}
.cell[data-on="1"] svg{visibility:visible}

/* empty state */
.empty{text-align:center; padding:26px 10px}
.empty h3{font-family:var(--f-dis); font-size:22px; margin:0 0 6px}
.empty p{color:var(--bark-soft); margin:0 0 16px; font-weight:600}
.tpl{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.tpl button{background:var(--card); border:1px solid var(--line); border-radius:999px; padding:10px 16px;
  font-weight:700; box-shadow:var(--shadow)}

/* sheet */
.sheetwrap{position:fixed; inset:0; z-index:40; display:flex; align-items:flex-end; justify-content:center}
.sheetwrap[hidden]{display:none}
.sheetbg{position:absolute; inset:0; background:rgba(20,24,19,.42); backdrop-filter:blur(3px)}
.sheet{position:relative; width:min(560px,100%); max-height:88vh; overflow:auto; background:var(--card);
  border:1px solid var(--line); border-radius:26px 26px 0 0; padding:18px 18px calc(24px + env(safe-area-inset-bottom));
  box-shadow:0 -20px 60px -30px rgba(0,0,0,.7); animation:up .26s cubic-bezier(.22,1,.36,1)}
@keyframes up{from{transform:translateY(26px); opacity:.6}to{transform:none; opacity:1}}
@media (prefers-reduced-motion:reduce){ .sheet{animation:none} }
@media (min-width:640px){ .sheetwrap{align-items:center} .sheet{border-radius:26px} }
.sheet h2{font-family:var(--f-dis); font-size:22px; margin:2px 0 14px}
.field{display:block; margin:0 0 14px}
.field span{display:block; font-weight:800; font-size:13.5px; color:var(--bark-soft); margin-bottom:6px}
.field input[type=text], .field select{width:100%; padding:12px 13px; border-radius:13px;
  border:2px solid var(--line); background:var(--paper); outline:none; font-weight:700}
.field input:focus, .field select:focus{border-color:var(--leaf)}
.opts{display:flex; flex-wrap:wrap; gap:8px}
.opt{padding:11px 15px; border-radius:13px; border:2px solid var(--line); background:var(--paper); font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--leaf); background:var(--leaf-soft); color:var(--leaf-deep)}
.days{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
.days button{width:44px; height:44px; border-radius:13px; border:2px solid var(--line); background:var(--paper); font-weight:800}
.days button[aria-pressed="true"]{border-color:var(--leaf); background:var(--leaf); color:#fff}
.emojigrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(48px,1fr)); gap:7px}
.emojigrid button{height:48px; border-radius:13px; background:var(--paper); border:1px solid var(--line); font-size:24px}
.colors{display:flex; gap:9px; flex-wrap:wrap}
.colors button{width:42px; height:42px; border-radius:50%; border:3px solid transparent}
.colors button[aria-pressed="true"]{border-color:var(--bark)}
.sheetfoot{display:flex; gap:9px; margin-top:6px; flex-wrap:wrap}
.btn{padding:13px 18px; border-radius:14px; font-weight:800; background:var(--paper);
  border:1px solid var(--line); flex:1; min-width:120px; text-align:center}
.btn.primary{background:var(--leaf); color:#fff; border-color:var(--leaf)}
.btn.danger{color:var(--berry)}

/* toast */
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom)); transform:translateX(-50%);
  background:var(--bark); color:var(--paper); padding:13px 15px; border-radius:16px; display:flex; gap:14px;
  align-items:center; z-index:50; box-shadow:0 16px 40px -18px rgba(0,0,0,.7); font-weight:700; max-width:92vw}
.toast[hidden]{display:none}
.toast button{color:var(--leaf-deep); background:var(--paper); padding:7px 13px; border-radius:10px; font-weight:800}
:root[data-theme="dusk"] .toast button{color:var(--paper); background:var(--leaf-deep)}

canvas#confetti{position:fixed; inset:0; pointer-events:none; z-index:45}
canvas#confetti[hidden]{display:none}

/* big-buttons (kid) mode */
body.big{--row:76px}
body.big .txt{font-size:21px}
body.big .emoji{width:52px; height:52px; font-size:30px; border-radius:14px}
body.big .tick{width:56px; height:56px; border-radius:17px}
body.big .tick svg{width:31px; height:31px}
body.big .tags, body.big .handle{display:none}
body.big .addbtn{height:56px; min-width:56px; font-size:21px}
body.big .addbox input{font-size:20px}

@media (max-width:520px){
  .wrap{padding:0 12px 130px}
}

/* print: a clean paper checklist */
@media print{
  body::before, header.top, .views, .rail, .addbox, .rowbtn, .sheetwrap, .toast, canvas{display:none !important}
  body{background:#fff}
  .card, .row{box-shadow:none; border-color:#bbb; break-inside:avoid}
  .row{min-height:44px}
  .tick{border-color:#555; background:#fff}
}

function t(k){ var d=T[S&&S.lang]||T.en; return (d[k]!==undefined?d[k]:(T.en[k]!==undefined?T.en[k]:k)); }

/* ---------------- storage ---------------- */
var KEY="bjorkliste.v1", mem={};
function load(){ try{ var r=localStorage.getItem(KEY); return r?JSON.parse(r):null; }catch(e){ return mem.d||null; } }
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ mem.d=S; }
  if(typeof syncPush==="function") syncPush();
}

/* ---------------- helpers ---------------- */
var COLORS=["#4F8B4A","#5B8FB0","#C2453C","#E7B14A","#8A76C4","#4FA79B"];
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3); }
function key(d){ var m=d.getMonth()+1, day=d.getDate();
  return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(day<10?"0":"")+day; }
function today(){ return new Date(); }
function widx(d){ return (d.getDay()+6)%7; }               /* 0 = Monday */
function weekStart(d){ var x=new Date(d); x.setDate(x.getDate()-widx(x)); x.setHours(0,0,0,0); return x; }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function seed(){
  var da = (navigator.language||"en").toLowerCase().indexOf("da")===0 ||
           (navigator.language||"").toLowerCase().indexOf("fo")===0;
  var lang = da ? "da" : "en";
  var L = da ? [
    {n:"Bjørks dag", e:"🌿", c:0, items:[
      ["Drik et glas vand","💧","daily"],["Morgenkaffe","☕","daily"],
      ["Gåtur","👟","weekly",[0,2,4]],["Læs 20 sider","📖","daily"],["Ring til mor","📞","none"]]},
    {n:"Indkøb", e:"🛒", c:1, items:[
      ["Mælk","🥛","none"],["Rugbrød","🍞","none"],["Kaffebønner","☕","none"],["Bananer","🍌","none"]]},
    {n:"Børnene", e:"🧸", c:3, items:[
      ["Børst tænder","🪥","daily"],["Klæd dig på","👕","daily"],
      ["Ryd legetøj op","🧸","daily"],["Pak tasken","🎒","weekly",[0,1,2,3,4]]]}
  ] : [
    {n:"Bjørk's day", e:"🌿", c:0, items:[
      ["Drink a glass of water","💧","daily"],["Morning coffee","☕","daily"],
      ["Go for a walk","👟","weekly",[0,2,4]],["Read 20 pages","📖","daily"],["Call mum","📞","none"]]},
    {n:"Shopping", e:"🛒", c:1, items:[
      ["Milk","🥛","none"],["Bread","🍞","none"],["Coffee beans","☕","none"],["Bananas","🍌","none"]]},
    {n:"The kids", e:"🧸", c:3, items:[
      ["Brush teeth","🪥","daily"],["Get dressed","👕","daily"],
      ["Tidy the toys","🧸","daily"],["Pack the bag","🎒","weekly",[0,1,2,3,4]]]}
  ];
  var lists = L.map(function(l){
    return { id:uid(), name:l.n, emoji:l.e, color:l.c, items:l.items.map(function(it){
      return mkItem(it[0], it[1], it[2], it[3]); }) };
  });
  lists.forEach(function(l){ l.ts=Date.now(); });
  return { v:2, name:"Bjørk", lang:lang, theme:"day", sound:true, big:false,
           view:"today", active:lists[0].id, lists:lists, tomb:{}, prefTs:Date.now() };
}
function mkItem(text, emoji, repeat, days){
  return { id:uid(), text:text, emoji:emoji||"✅", repeat:repeat||"none",
           days:days||[0,1,2,3,4,5,6], dom:1, time:"", done:false, hist:{}, ts:Date.now() };
}
/* every change carries the moment it happened, so two phones can be merged safely */
function stamp(o){ if(o) o.ts=Date.now(); return o; }
function bury(id){ S.tomb=S.tomb||{}; S.tomb[id]=Date.now(); }
function touchPrefs(){ S.prefTs=Date.now(); }

var S = load() || seed();
if(!S.lists || !S.lists.length){ S = seed(); }
if(!S.lists.some(function(l){ return l.id===S.active; })) S.active=S.lists[0].id;
if(!S.v || S.v<2){
  S.v=2; S.tomb=S.tomb||{}; S.prefTs=S.prefTs||Date.now();
  S.lists.forEach(function(L){ L.ts=L.ts||Date.now();
    L.items.forEach(function(it){ it.ts=it.ts||Date.now(); }); });
}

function activeList(){ return S.lists.filter(function(l){return l.id===S.active;})[0] || S.lists[0]; }
function findItem(id){
  for(var i=0;i<S.lists.length;i++){ var L=S.lists[i];
    for(var j=0;j<L.items.length;j++){ if(L.items[j].id===id) return {list:L, item:L.items[j], idx:j}; } }
  return null;
}
function isDue(it, d){
  if(it.repeat==="none") return true;
  if(it.repeat==="daily") return true;
  if(it.repeat==="weekly") return it.days.indexOf(widx(d))>-1;
  if(it.repeat==="monthly") return d.getDate()===(it.dom||1);
  return true;
}
function isDone(it, d){
  if(it.repeat==="none") return !!it.done;
  return !!it.hist[key(d)];
}
function setDone(it, d, val){
  var was = isDone(it,d);
  if(it.repeat==="none"){ it.done=!!val; }
  else { if(val) it.hist[key(d)]=1; else delete it.hist[key(d)]; }
  stamp(it);
}

/* ---------------- sound + confetti ---------------- */
var ac=null;
function blip(freq,dur){
  if(!S.sound) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended") ac.resume();
    var o=ac.createOscillator(), g=ac.createGain(), t0=ac.currentTime;
    o.type="sine"; o.frequency.setValueAtTime(freq,t0);
    g.gain.setValueAtTime(.0001,t0);
    g.gain.exponentialRampToValueAtTime(.13,t0+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t0+(dur||.14));
    o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0+(dur||.14)+.03);
  }catch(e){}
}
function chime(up){ if(up){ blip(660,.1); setTimeout(function(){blip(990,.14);},80); } else blip(300,.09); }

var cv=$("#confetti"), ctx=null, parts=[], raf=null;
function leaves(){
  if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  cv.hidden=false; cv.width=innerWidth; cv.height=innerHeight; ctx=cv.getContext("2d");
  parts=[]; var cols=["#4F8B4A","#8FC486","#E7B14A","#CFE4C4","#5B8FB0"];
  for(var i=0;i<70;i++) parts.push({
    x:Math.random()*cv.width, y:-30-Math.random()*cv.height*.5,
    vx:(Math.random()-.5)*1.4, vy:2+Math.random()*2.6, r:5+Math.random()*7,
    a:Math.random()*6.28, va:(Math.random()-.5)*.16, c:cols[(Math.random()*cols.length)|0]
  });
  cancelAnimationFrame(raf); step();
}
function step(){
  ctx.clearRect(0,0,cv.width,cv.height); var alive=0;
  for(var i=0;i<parts.length;i++){ var p=parts[i];
    p.x+=p.vx; p.y+=p.vy; p.a+=p.va; p.vx+=Math.sin(p.y/40)*.02;
    if(p.y<cv.height+40) alive++;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c;
    ctx.beginPath(); ctx.ellipse(0,0,p.r,p.r*.52,0,0,6.283); ctx.fill(); ctx.restore();
  }
  if(alive) raf=requestAnimationFrame(step); else { cv.hidden=true; }
}

/* ---------------- toast ---------------- */
var toastT=null, undoFn=null;
function toast(msg, label, fn){
  clearTimeout(toastT);
  $("#toastMsg").textContent=msg;
  var b=$("#toastBtn");
  if(fn){ b.hidden=false; b.textContent=label; undoFn=fn; } else { b.hidden=true; undoFn=null; }
  $("#toast").hidden=false;
  toastT=setTimeout(function(){ $("#toast").hidden=true; undoFn=null; }, 6000);
}
$("#toastBtn").addEventListener("click", function(){
  if(undoFn){ undoFn(); undoFn=null; } $("#toast").hidden=true;
});

/* ---------------- render ---------------- */
var TICK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12.5l5.2 5.3L20 6.6"/></svg>';

function rowHTML(it, d, opts){
  opts=opts||{};
  var done=isDone(it,d);
  var tags="";
  if(!S.big){
    /* a set time leads, then the list name in the Today view */
    if(it.time) tags+='<span class="tag on">⏰ '+esc(it.time)+'</span>';
    if(opts.listName) tags+='<span class="tag">'+esc(opts.listName)+'</span>';
    var r=repLabel(it);
    if(r) tags+='<span class="tag on">'+esc(r)+'</span>';
  }
  return '<div class="row'+(done?" done":"")+'" data-id="'+it.id+'">'+
    '<button class="tick" data-act="toggle" role="checkbox" aria-checked="'+done+'" '+
      'aria-label="'+esc(it.text)+'">'+TICK+'</button>'+
    '<button class="emoji" data-act="emoji" aria-label="'+t("pickEmoji")+'">'+it.emoji+'</button>'+
    '<div class="main"><div class="txt" data-act="text" contenteditable="plaintext-only" '+
      'role="textbox" aria-label="'+t("editItem")+'">'+esc(it.text)+'</div>'+
      (tags?'<div class="tags">'+tags+'</div>':'')+'</div>'+
    (S.big?'':'<span class="rowtools">'+
      '<button class="rowbtn" data-act="repeat" aria-label="'+t("repeat")+'">🔁</button>'+
      '<button class="rowbtn" data-act="del" aria-label="'+t("del")+'">✕</button>'+
      '<button class="rowbtn handle" data-handle aria-label="'+t("moveHint")+'">⠿</button></span>'+
      '<button class="rowbtn more" data-act="more" aria-label="'+t("more")+'">⋯</button>')+
    (S.big?'<button class="rowbtn" data-act="del" aria-label="'+t("del")+'">✕</button>':'')+
  '</div>';
}

function progressCard(a,b){
  var d=today(), h=d.getHours();
  var greet = h<11 ? t("morning") : (h>=18 ? t("helloEve") : t("hello"));
  var sub = b===0 ? t("nothing") : (a===b ? t("allDone") : t("doneOf").replace("{a}",a).replace("{b}",b));
  var pct = b? Math.round(a/b*100) : 0;
  return '<section class="card"><h2 class="hello">'+greet+", "+esc(S.name||"Bjørk")+' 🌿</h2>'+
    '<p class="sub">'+sub+'</p><div class="bar"><i style="width:'+pct+'%"></i></div></section>';
}

function renderToday(){
  var d=today(), open=[], done=[], a=0,b=0;
  S.lists.forEach(function(L){
    L.items.forEach(function(it){
      if(!isDue(it,d)) return;
      b++; if(isDone(it,d)){ a++; done.push([it,L]); } else open.push([it,L]);
    });
  });
  var h = progressCard(a,b);
  if(open.length){
    h+='<div class="rows">'+open.map(function(p){
      return rowHTML(p[0], d, {listName:p[1].emoji+" "+p[1].name}); }).join("")+'</div>';
  } else if(b>0){
    h+='<div class="card empty"><h3>'+t("allDone")+' 🎉</h3></div>';
  }
  h+=addBoxHTML();
  if(done.length){
    h+='<div class="grouphead"><span class="dot" style="background:'+COLORS[0]+'"></span>'+t("completed")+' ('+done.length+')</div>'+
       '<div class="rows">'+done.map(function(p){ return rowHTML(p[0], d, {listName:p[1].emoji+" "+p[1].name}); }).join("")+'</div>';
  }
  return h;
}

function addBoxHTML(){
  var L=activeList();
  return '<div class="addbox"><span class="emoji" aria-hidden="true">'+L.emoji+'</span>'+
    '<input id="addInput" type="text" placeholder="'+(hearing?t("listening"):t("addHere"))+'" '+
      'aria-label="'+t("addHere")+'" autocomplete="off">'+
    (SR?'<button class="micbtn" id="micBtn" aria-label="'+t("voice")+'">🎤</button>':'')+
    '<button class="addbtn" id="addBtn">+</button></div>'+
    (hearing?'<div class="hearing">🎙️ '+t("voiceHint")+'</div>':'');
}

function renderList(){
  var L=activeList(), d=today();
  var a=L.items.filter(function(it){ return isDone(it,d); }).length;
  var h='<section class="card"><h2 class="hello">'+L.emoji+" "+esc(L.name)+'</h2>'+
    '<p class="sub">'+t("doneOf").replace("{a}",a).replace("{b}",L.items.length)+'</p>'+
    '<div class="bar"><i style="width:'+(L.items.length?Math.round(a/L.items.length*100):0)+'%"></i></div>'+
    '<div class="sheetfoot"><button class="btn" data-act="editlist">✏️ '+t("listName")+'</button></div></section>';
  if(!L.items.length){
    h+='<div class="card empty"><h3>'+t("emptyTitle")+'</h3><p>'+t("emptyText")+'</p>'+
      '<div class="tpl">'+
      '<button data-tpl="morning">🌅 '+t("tplMorning")+'</button>'+
      '<button data-tpl="clean">🧹 '+t("tplClean")+'</button>'+
      '<button data-tpl="shop">🛒 '+t("tplShop")+'</button>'+
      '<button data-tpl="work">💼 '+t("tplWork")+'</button></div></div>';
  } else {
    h+='<div class="rows" id="sortable">'+L.items.map(function(it){ return rowHTML(it,d,{}); }).join("")+'</div>';
  }
  h+=addBoxHTML();
  return h;
}

function renderWeek(){
  var L=activeList(), ws=weekStart(today()), tk=key(today());
  var ds=T[S.lang]?T[S.lang].days:T.en.days;
  var rep=L.items.filter(function(it){ return it.repeat!=="none"; });
  var one=L.items.filter(function(it){ return it.repeat==="none"; });

  var old=$("#sheetBody"), fresh=old.cloneNode(false);
  old.parentNode.replaceChild(fresh, old);

  var f=$("#sheetBody input, #sheetBody button");

  openSheet(it.emoji+" "+plain(it.text) || t("more"),

        backup.list.items.splice(backup.idx,0,backup.item); render(); });
    }
  });

/* ================= reminders =================
   A web page can only speak while it is open, so there are two halves:
   a notification while the app is running, and a real calendar entry that
   rings on the phone whether or not Bjørkliste is open. */
var QUICK=["07:00","08:00","12:00","16:00","18:00","20:00"];
function pad2(n){ return (n<10?"0":"")+n; }
function nowHM(d){ return pad2(d.getHours())+":"+pad2(d.getMinutes()); }
function minsOf(hm){ var p=String(hm).split(":"); return (+p[0])*60+(+p[1]); }

function firedMap(){
  if(mem.fired) return mem.fired;
  var f={};
  try{ f=JSON.parse(localStorage.getItem("bjorkliste.fired")||"{}"); }catch(e){}
  var k=key(today());
  for(var x in f){ if(x.indexOf("|"+k)<0) delete f[x]; }   /* yesterday's are irrelevant */
  mem.fired=f; return f;
}
function markFired(mk){
  var f=firedMap(); f[mk]=1;
  try{ localStorage.setItem("bjorkliste.fired", JSON.stringify(f)); }catch(e){}
}
function checkAlarms(){
  if(!("Notification" in window) || Notification.permission!=="granted") return;
  var d=today(), k=key(d), hm=nowHM(d), f=firedMap();
  S.lists.forEach(function(L){
    L.items.forEach(function(it){
      if(!it.time || !isDue(it,d) || isDone(it,d)) return;
      if(minsOf(it.time) > minsOf(hm)) return;
      var mk=it.id+"|"+k;
      if(f[mk]) return;
      markFired(mk);
      /* opening the app in the evening shouldn't dump the whole morning on you */
      if(minsOf(hm)-minsOf(it.time) > 90) return;
      try{
        new Notification(t("timeNow")+" "+plain(it.text), {
          body: L.emoji+" "+plain(L.name), tag: mk, icon: FAVICON });
      }catch(e){}
      chime(true);
    });
  });
}

function askNotify(then){
  if(!("Notification" in window)){ then&&then(false); return; }
  if(Notification.permission==="granted"){ then&&then(true); return; }
  if(Notification.permission==="denied"){ then&&then(false); return; }
  Notification.requestPermission().then(function(p){ then&&then(p==="granted"); });
}

/* ---- calendar file: floating local time, so it means 07:00 wherever you are ---- */
function icsEsc(s){ return plain(s).replace(/([,;\\])/g,"\\$1").replace(/\n/g," "); }
function icsRule(it){
  if(it.repeat==="daily") return "RRULE:FREQ=DAILY";
  if(it.repeat==="weekly"){
    var W=["MO","TU","WE","TH","FR","SA","SU"];
    var days=(it.days&&it.days.length?it.days:[0,1,2,3,4,5,6]).map(function(i){ return W[i]; });
    return "RRULE:FREQ=WEEKLY;BYDAY="+days.join(",");
  }
  if(it.repeat==="monthly") return "RRULE:FREQ=MONTHLY;BYMONTHDAY="+(it.dom||1);
  return "";
}
function icsStamp(d){
  return d.getUTCFullYear()+pad2(d.getUTCMonth()+1)+pad2(d.getUTCDate())+"T"+
         pad2(d.getUTCHours())+pad2(d.getUTCMinutes())+"00Z";
}
function buildIcs(items){
  var d=today(), out=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Bjorkliste//DA","CALSCALE:GREGORIAN"];
  var stampNow=icsStamp(new Date()), any=false;
  items.forEach(function(it){
    if(!it.time) return;
    any=true;
    var start=d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+"T"+it.time.replace(":","")+"00";
    var rule=icsRule(it);
    out.push("BEGIN:VEVENT",
      "UID:"+it.id+"@bjorkliste",
      "DTSTAMP:"+stampNow,
      "DTSTART:"+start,
      "DURATION:PT15M",
      "SUMMARY:"+icsEsc(it.text),
      "DESCRIPTION:"+icsEsc("Bjørkliste"));
    if(rule) out.push(rule);
    out.push("BEGIN:VALARM","TRIGGER:PT0M","ACTION:DISPLAY",
      "DESCRIPTION:"+icsEsc(it.text),"END:VALARM","END:VEVENT");
  });
  out.push("END:VCALENDAR");
  return any ? out.join("\r\n") : "";
}

function downloadIcs(items, name){
  var text=buildIcs(items);
  if(!text){
    if(items.length===1){ sheetTime(items[0].id); setTimeout(function(){toast(t("noRemind"));},50); }
    else { closeSheet(); toast(t("noRemind")); }
    return;
  }

  var it=items[0];
  var title=encodeURIComponent(plain(it.text));
  var desc=encodeURIComponent("Bjørkliste");

  // Android: send directly to the calendar app first
  if(/Android/i.test(navigator.userAgent)){
    var d=today();
    var tm=(it.time||"09:00").split(":");
    d.setHours(+tm[0],+tm[1],0,0);
    var start=d.getTime();
    var end=start+900000;
    var intent="intent://calendar/event?title="+title+"&description="+desc+"&beginTime="+start+"&endTime="+end+"#Intent;scheme=content;package=com.google.android.calendar;end";
    window.location.href=intent;
    setTimeout(function(){fallbackIcs(text,name);},1200);
    return;
  }

  fallbackIcs(text,name);
}

function fallbackIcs(text,name){
  var blob=new Blob([text],{type:"text/calendar;charset=utf-8"});
  var url=URL.createObjectURL(blob);
  var a=document.createElement("a");
  a.href=url;
  a.download="bjorkliste-"+slug(name)+".ics";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},3000);
  closeSheet();
}

/* drag to reorder */
var drag=null;
main.addEventListener("pointerdown", function(e){
  var h=e.target.closest("[data-handle]"); if(!h) return;
  var row=h.closest(".row"), wrap=row.parentElement;
  drag={row:row, wrap:wrap, y:e.clientY};
  row.classList.add("dragging");
  try{ h.setPointerCapture(e.pointerId); }catch(err){}
  e.preventDefault();
});
document.addEventListener("pointermove", function(e){
  if(!drag) return;
  var dy=e.clientY-drag.y;
  drag.row.style.transform="translateY("+dy+"px)";
  var r=drag.row.getBoundingClientRect(), mid=r.top+r.height/2;
  var rows=Array.prototype.slice.call(drag.wrap.querySelectorAll(".row"));
  for(var i=0;i<rows.length;i++){
    var o=rows[i]; if(o===drag.row) continue;
    var ob=o.getBoundingClientRect();
    if(mid>ob.top && mid<ob.bottom){
      var before = mid < ob.top+ob.height/2;
      drag.wrap.insertBefore(drag.row, before?o:o.nextSibling);
      drag.y=e.clientY; drag.row.style.transform="";
      break;
    }
  }
});
document.addEventListener("pointerup", function(){
  if(!drag) return;
  drag.row.style.transform=""; drag.row.classList.remove("dragging");
  var order=Array.prototype.map.call(drag.wrap.querySelectorAll(".row"), function(r){
    return r.getAttribute("data-id"); });
  var L=activeList();
  L.items.sort(function(a,b){
    var ia=order.indexOf(a.id), ib=order.indexOf(b.id);
    if(ia<0||ib<0) return 0; return ia-ib; });
  stamp(L); drag=null; save();
});

function detach(){ if(SY.ref && SY.cb){ SY.ref.off("value", SY.cb); } SY.ref=null; SY.cb=null; }

function exportDoc(s){
  var cut=Date.now()-30*864e5, tomb={};
  for(var k in (s.tomb||{})) if(s.tomb[k]>cut) tomb[k]=s.tomb[k];
  s.tomb=tomb;
  return { v:2, name:s.name, lang:s.lang, theme:s.theme, sound:s.sound, big:s.big,
           prefTs:s.prefTs||0, tomb:tomb, lists:s.lists };
}

function mergeDocs(local, remote){
  var out={v:2, view:local.view, active:local.active, hidSeen:local.hidSeen};
  var pref = (remote.prefTs||0) > (local.prefTs||0) ? remote : local;
  ["name","lang","theme","sound","big"].forEach(function(k){ out[k]=pref[k]; });
  out.prefTs=Math.max(local.prefTs||0, remote.prefTs||0);
  var tomb={};
  [local.tomb||{}, remote.tomb||{}].forEach(function(m){
    for(var k in m){ if(!tomb[k] || m[k]>tomb[k]) tomb[k]=m[k]; } });
  out.tomb=tomb;
  var la={}, ra={}, ids=[];
  (local.lists||[]).forEach(function(L){ la[L.id]=L; ids.push(L.id); });
  (remote.lists||[]).forEach(function(L){ ra[L.id]=L; if(ids.indexOf(L.id)<0) ids.push(L.id); });
  out.lists=[];
  ids.forEach(function(id){
    var A=la[id], B=ra[id];
    var lts=Math.max(A?A.ts||0:0, B?B.ts||0:0);
    if(tomb[id] && lts < tomb[id]) return;                       /* deleted elsewhere */
    var base = !A ? B : (!B ? A : ((B.ts||0)>(A.ts||0) ? B : A));
    var L={id:id, name:base.name, emoji:base.emoji, color:base.color, ts:lts, items:[]};
    var ia={}, ib={}, iids=[];
    ((A&&A.items)||[]).forEach(function(it){ ia[it.id]=it; iids.push(it.id); });
    ((B&&B.items)||[]).forEach(function(it){ ib[it.id]=it; if(iids.indexOf(it.id)<0) iids.push(it.id); });
    var ord=((base.items)||[]).map(function(it){ return it.id; });   /* order from the newer side */
    iids.sort(function(x,y){
      var px=ord.indexOf(x), py=ord.indexOf(y);
      if(px<0) px=1e6; if(py<0) py=1e6; return px-py; });
    iids.forEach(function(iid){
      var x=ia[iid], y=ib[iid], its=Math.max(x?x.ts||0:0, y?y.ts||0:0);
      if(tomb[iid] && its < tomb[iid]) return;
      L.items.push(!x ? y : (!y ? x : (((y.ts||0)>(x.ts||0)) ? y : x)));
    });
    out.lists.push(L);
  });
  if(!out.lists.length) out.lists=local.lists.slice();
  if(!out.lists.some(function(L){ return L.id===out.active; })) out.active=out.lists[0].id;
  return out;
}

function onRemote(snap){
  var v=snap.val();
  if(!v || !v.doc){ SY.last=""; syncPush(true); return; }
  var remote; try{ remote=JSON.parse(v.doc); }catch(e){ return; }
  if(S.hidSeen!==SY.hid){
    /* first time this device joins this household: take what is already there,
       keeping a copy of whatever was on the device before */
    try{ localStorage.setItem("bjorkliste.beforeSync", JSON.stringify(S)); }catch(e){}
    var view=S.view;
    S=remote; S.view=view; S.hidSeen=SY.hid;
    if(!S.lists.some(function(L){ return L.id===S.active; })) S.active=S.lists[0].id;
  } else {
    if(v.by===DEVICE) return;
    S=mergeDocs(S, remote);
  }
  SY.last=JSON.stringify(exportDoc(S));
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ mem.d=S; }
  render();
  setState("on");
}

function syncPush(now){
  if(!SY.ref) return;
  clearTimeout(SY.timer);
  SY.timer=setTimeout(function(){
    if(!SY.ref) return;
    var doc=exportDoc(S), str=JSON.stringify(doc);
    if(str===SY.last) return;                 /* nothing actually changed */
    SY.last=str; S.hidSeen=SY.hid;
    SY.ref.set({doc:str, by:DEVICE, at:Date.now()})
      .then(function(){ setState("on"); })
      .catch(function(e){ setState("err", e.message); });
  }, now?60:800);
}

var PW=595.28, PH=841.89, PM=48;
var INK=[42,46,39], SOFT=[110,118,104], RULE=[214,222,206], LEAF=[79,139,74];
var PCOL=[[79,139,74],[91,143,176],[194,69,60],[231,177,74],[138,118,196],[79,167,155]];

/* the PDF fonts cover æøå but not emoji, so icons are dropped rather than drawn as tofu */
function plain(s){
  return String(s).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{FE0F}\u{1F1E6}-\u{1F1FF}]/gu,"")
    .replace(/\s+/g," ").trim();
}
function slug(s){ return plain(s).replace(/[^\w\u00C0-\u017F -]/g,"").replace(/\s+/g,"-").slice(0,40) || "liste"; }
function repLabel(it){
  if(it.repeat==="daily") return t("daily");
  if(it.repeat==="monthly") return t("monthly");
  if(it.repeat==="weekly"){
    var ds=T[S.lang]?T[S.lang].days:T.en.days;
    return it.days.map(function(i){ return ds[i]; }).join(" ");
  }
  return "";
}
function pdfHead(doc, sub){
  doc.setFont("helvetica","bold"); doc.setFontSize(23);
  doc.setTextColor(INK[0],INK[1],INK[2]);
  doc.text("Bjørkliste", PM, 62);
  doc.setFont("helvetica","normal"); doc.setFontSize(9.5);
  doc.setTextColor(SOFT[0],SOFT[1],SOFT[2]);
  doc.text(plain(sub), PW-PM, 62, {align:"right"});
  var y=78;
  doc.setDrawColor(RULE[0],RULE[1],RULE[2]); doc.setLineWidth(2.4);
  doc.line(PM,y,PW-PM,y);
  doc.setDrawColor(INK[0],INK[1],INK[2]);          /* birch dashes across the rule */
  [0.06,0.27,0.52,0.79].forEach(function(p){
    var x=PM+(PW-2*PM)*p; doc.line(x,y,x+20,y);
  });
  return 108;
}
function pdfFoot(doc){
  var n=doc.internal.getNumberOfPages();
  for(var i=1;i<=n;i++){
    doc.setPage(i);
    doc.setFont("helvetica","normal"); doc.setFontSize(8.5);
    doc.setTextColor(SOFT[0],SOFT[1],SOFT[2]);
    doc.text(String(i)+" / "+n, PW/2, PH-30, {align:"center"});
  }
}
function pdfBox(doc,x,y,size,ticked){
  doc.setDrawColor(160,170,152); doc.setLineWidth(1.1);
  doc.roundedRect(x, y-size+2, size, size, 3, 3, "S");
  if(ticked){
    doc.setDrawColor(LEAF[0],LEAF[1],LEAF[2]); doc.setLineWidth(1.9);
    doc.line(x+2.6, y-size/2+1.4, x+size*0.42, y-1.4);
    doc.line(x+size*0.42, y-1.4, x+size-2.2, y-size+5.2);
  }
}
function listTitle(doc, L, y){
  if(y>PH-150){ doc.addPage(); y=pdfHead(doc, plain(S.name||"Bjørk")+" · "+key(today())); }
  var c=PCOL[L.color%PCOL.length];
  doc.setFillColor(c[0],c[1],c[2]);
  doc.roundedRect(PM, y-11, 5, 15, 2.5, 2.5, "F");
  doc.setFont("helvetica","bold"); doc.setFontSize(14);
  doc.setTextColor(INK[0],INK[1],INK[2]);
  doc.text(plain(L.name), PM+15, y);
  return y+22;
}
function pdfList(doc, L, y){
  var d=today(), maxw=PW-PM*2-34-95;
  y=listTitle(doc,L,y);
  if(!L.items.length){
    doc.setFont("helvetica","italic"); doc.setFontSize(10);
    doc.setTextColor(SOFT[0],SOFT[1],SOFT[2]);
    doc.text(plain(t("emptyTitle")), PM+22, y+2); return y+26;
  }
  L.items.forEach(function(it){
    var lines=doc.splitTextToSize(plain(it.text), maxw), h=Math.max(24, lines.length*13+11);
    if(y+h>PH-56){ doc.addPage(); y=pdfHead(doc, plain(L.name)); y=listTitle(doc,L,y); }
    doc.setDrawColor(RULE[0],RULE[1],RULE[2]); doc.setLineWidth(.7);
    doc.line(PM, y+h-8, PW-PM, y+h-8);
    pdfBox(doc, PM+3, y+5, 13, isDone(it,d));
    doc.setFont("helvetica","normal"); doc.setFontSize(11);
    doc.setTextColor(INK[0],INK[1],INK[2]);
    doc.text(lines, PM+26, y+4);
    var r=repLabel(it);
    if(r){
      doc.setFontSize(8.5); doc.setTextColor(SOFT[0],SOFT[1],SOFT[2]);
      doc.text(plain(r), PW-PM-2, y+4, {align:"right"});
    }
    y+=h;
  });
  return y+16;
}
function pdfWeek(doc, L, y){
  var ws=weekStart(today()), ds=T[S.lang]?T[S.lang].days:T.en.days;
  var rep=L.items.filter(function(it){ return it.repeat!=="none"; });
  var namew=210, cw=(PW-PM*2-namew)/7, rowh=26;
  y=listTitle(doc,L,y);
  function head(yy){
    doc.setFont("helvetica","bold"); doc.setFontSize(8.5);
    doc.setTextColor(SOFT[0],SOFT[1],SOFT[2]);
    for(var i=0;i<7;i++){
      var day=new Date(ws); day.setDate(ws.getDate()+i);
      doc.text(ds[i]+" "+day.getDate(), PM+namew+cw*i+cw/2, yy, {align:"center"});
    }
    doc.setDrawColor(RULE[0],RULE[1],RULE[2]); doc.setLineWidth(1.4);
    doc.line(PM, yy+6, PW-PM, yy+6);
    return yy+6;
  }
  y=head(y);
  rep.forEach(function(it,n){
    if(y+rowh>PH-56){ doc.addPage(); y=pdfHead(doc, plain(L.name)); y=listTitle(doc,L,y); y=head(y); }
    if(n%2===0){ doc.setFillColor(246,248,243); doc.rect(PM, y, PW-PM*2, rowh, "F"); }
    doc.setFont("helvetica","normal"); doc.setFontSize(10);
    doc.setTextColor(INK[0],INK[1],INK[2]);
    doc.text(doc.splitTextToSize(plain(it.text), namew-14)[0], PM+6, y+17);
    for(var i=0;i<7;i++){
      var day=new Date(ws); day.setDate(ws.getDate()+i);
      if(!isDue(it,day)) continue;
      pdfBox(doc, PM+namew+cw*i+cw/2-6.5, y+18, 13, isDone(it,day));
    }
    y+=rowh;
  });
  if(!rep.length){
    doc.setFont("helvetica","italic"); doc.setFontSize(10);
    doc.setTextColor(SOFT[0],SOFT[1],SOFT[2]);
    doc.text(plain(t("noRepeat")), PM+6, y+16); y+=26;
  }
  return y+16;
}
function makePdf(mode){
  var J = window.jspdf && window.jspdf.jsPDF;
  if(!J){ closeSheet(); toast(t("pdfMissing")); setTimeout(function(){ window.print(); }, 900); return; }
  var doc=new J({unit:"pt", format:"a4"});
  var L=activeList(), stamp2=key(today()), name;
  if(mode==="all"){
    var y=pdfHead(doc, plain(S.name||"Bjørk")+" · "+stamp2);
    S.lists.forEach(function(x){ y=pdfList(doc, x, y); });
    name="Bjorkliste-alle-"+stamp2+".pdf";
  } else if(mode==="week"){
    var ws=weekStart(today());
    var y2=pdfHead(doc, plain(t("week"))+" · "+key(ws));
    pdfWeek(doc, L, y2);
    name="Bjorkliste-"+slug(L.name)+"-uge-"+key(ws)+".pdf";
  } else {
    var y3=pdfHead(doc, plain(S.name||"Bjørk")+" · "+stamp2);
    pdfList(doc, L, y3);
    name="Bjorkliste-"+slug(L.name)+"-"+stamp2+".pdf";
  }
  pdfFoot(doc);
  doc.save(name);
  closeSheet(); toast(t("printed"));
}

/* ================= saying it out loud =================
   Uses the browser's own speech recognition, so nothing is sent anywhere by us
   and there is no key to keep. Chrome handles it best. */
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec=null, hearing=false, hearTimer=null;

/* a spoken "mælk" deserves a glass of milk, not a generic tick */
var EMAP=[
  [/mælk|milk|yoghurt|yogurt|skyr/,"🥛"], [/rugbrød|brød|bread|bolle|toast/,"🍞"],
  [/kaffe|coffee|espresso/,"☕"], [/te\b|tea/,"🍵"], [/æg\b|eggs?\b/,"🥚"],
  [/ost\b|cheese/,"🧀"], [/smør|butter/,"🧈"], [/banan|banana/,"🍌"],
  [/æble|apple/,"🍎"], [/appelsin|orange|citron|lemon|lime/,"🍋"],
  [/jordbær|bær|berries|strawberr/,"🍓"], [/drue|grape/,"🍇"],
  [/tomat|tomato/,"🍅"], [/agurk|cucumber|salat|lettuce|broccoli|grønt|vegetab/,"🥦"],
  [/gulerod|carrot/,"🥕"], [/kartof|potato|pommes/,"🥔"], [/løg\b|onion|hvidløg|garlic/,"🧅"],
  [/kylling|chicken|kød|meat|hakket|bøf|steak/,"🍗"], [/fisk|fish|laks|salmon|torsk/,"🐟"],
  [/ris\b|rice|pasta|spaghetti|nudler|noodle/,"🍝"], [/pizza/,"🍕"], [/suppe|soup/,"🍲"],
  [/sukker|sugar|mel\b|flour|bag(e|ing)/,"🧁"], [/kage|cake|slik|candy|chokolade|chocolate/,"🍫"],
  [/chips|snack|popcorn/,"🍿"], [/øl\b|beer|vin\b|wine/,"🍷"], [/vand|water|juice|sodavand|soda/,"💧"],
  [/is\b|ice ?cream/,"🍦"], [/frost|frozen/,"🧊"],
  [/tandbørste|tandpasta|tænder|teeth|tooth/,"🪥"], [/sæbe|shampoo|soap|bad\b|bath|brusebad|shower/,"🧴"],
  [/toiletpapir|toilet|papir|paper|servietter/,"🧻"], [/vaskepulver|vask|laundry|tøjvask/,"🧺"],
  [/rengør|clean|gulv|floor|støvsug|vacuum|skuresvamp/,"🧽"], [/skrald|affald|bin|rubbish|trash/,"🗑️"],
  [/opvask|dishes|dishwash/,"🍽️"], [/seng|bed\b|sengetøj|sheets/,"🛏️"],
  [/blomst|flower|plante|plant|vande/,"🪴"], [/have\b|garden|græs|lawn/,"🌱"],
  [/bil\b|car\b|benzin|petrol|tank/,"🚗"], [/cykel|bike|bicycle/,"🚲"],
  [/apotek|pharmacy|medicin|pille/,"💊"], [/læge|doctor|tandlæge|dentist/,"🩺"],
  [/bank|betal|pay|regning|bill|faktura/,"💰"], [/post|brev|letter|pakke|parcel/,"📮"],
  [/ring\b|ringe|call|telefon|phone/,"📞"], [/mail|email|skriv|write/,"✉️"],
  [/møde|meeting|arbejde|work/,"💼"], [/læs|read|bog\b|book/,"📖"],
  [/træn|gym|løb|run|motion|exercise|gåtur|walk/,"👟"], [/musik|music|guitar|klaver|piano/,"🎵"],
  [/fødselsdag|birthday|gave|gift|present/,"🎁"], [/ferie|holiday|rejse|travel|fly\b|flight/,"✈️"],
  [/skole|school|lektier|homework/,"🎒"], [/børn|kids|baby|ble\b|nappy|nappies/,"🧸"],
  [/hund|dog\b|kat\b|cat\b|foder/,"🐕"], [/indkøb|shopping|handle|købe|buy/,"🛒"]
];
function guessEmoji(text){
  var s=String(text).toLowerCase();
  for(var i=0;i<EMAP.length;i++){ if(EMAP[i][0].test(s)) return EMAP[i][1]; }
  return "✅";
}

function setHearing(on){
  hearing=on;
  document.body.classList.toggle("listening", on);
  render();
}
function addSpoken(raw){
  /* one sentence can hold a whole trolley: "mælk, rugbrød og bananer" */
  var parts=String(raw).toLowerCase()
    .replace(/^(tilføj|skriv|husk|køb|add|remember|buy)\s+/,"")
    .split(/,| og | and |;| samt /);
  var L=activeList(), n=0;
  parts.forEach(function(p){
    var txt=p.replace(/\s+/g," ").trim().replace(/[.!?]+$/,"");
    if(txt.length<2) return;
    txt=txt.charAt(0).toUpperCase()+txt.slice(1);
    L.items.push(mkItem(txt, guessEmoji(txt), "none"));
    n++;
  });
  if(n){ stamp(L); blip(760,.09); render(); }
}
function stopVoice(){
  clearTimeout(hearTimer);
  if(rec){ try{ rec.onend=null; rec.stop(); }catch(e){} }
  rec=null; setHearing(false);
}
function startVoice(){
  if(!SR){ toast(t("voiceNo")); return; }
  if(hearing){ stopVoice(); return; }
  try{ rec=new SR(); }catch(e){ toast(t("voiceNo")); return; }
  rec.lang = S.lang==="da" ? "da-DK" : "en-GB";
  rec.continuous=true; rec.interimResults=true;
  rec.onresult=function(e){
    var interim="";
    for(var i=e.resultIndex;i<e.results.length;i++){
      var r=e.results[i];
      if(r.isFinal) addSpoken(r[0].transcript);
      else interim+=r[0].transcript;
    }
    var inp=$("#addInput"); if(inp) inp.value=interim;
  };
  rec.onerror=function(e){
    if(e.error==="not-allowed" || e.error==="service-not-allowed"){ toast(t("micBlocked")); stopVoice(); }
  };
  /* Chrome cuts the stream after a pause; start it again so it feels continuous */
  rec.onend=function(){ if(hearing && rec){ try{ rec.start(); }catch(e){} } };
  try{ rec.start(); }catch(e){ toast(t("voiceNo")); return; }
  setHearing(true);
  hearTimer=setTimeout(stopVoice, 60000);
}

var installEvt=null;

function standalone(){
  return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
         window.navigator.standalone===true;
}
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
function sheetInstall(){
  var body;

      '<div class="sheetfoot"><button class="btn primary" id="inGo">📲 '+t("install")+'</button></div>';
  } else {

    body='<p class="note">'+(ios?t("installIos"):t("installAndroid"))+'</p>'+
         '<p class="note">'+t("installInApp")+'</p>';

  });
}
